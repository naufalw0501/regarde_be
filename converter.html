<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>WebP Image Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- React UMD ONLY -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px;
    }

    .card {
      max-width: 480px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 { font-size: 20px; margin-bottom: 16px; }

    select, input, button {
      width: 100%;
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script>
    const { useState } = React;

    function App() {
      const [files, setFiles] = useState([]);
      const [category, setCategory] = useState('logo');

      const convertImage = (file) => {
        return new Promise((resolve) => {
          const img = new Image();

          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            let quality = 0.8;
            let maxWidth = img.width;

            if (category === 'logo') {
              quality = 0.7;
              maxWidth = Math.min(800, img.width);
            }

            if (category === 'hero') {
              quality = 0.9;
              maxWidth = Math.min(2560, img.width);
            }

            const scale = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * scale;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
              const baseName = file.name.replace(/\.[^/.]+$/, '');
              resolve({
                blob,
                filename: baseName + '.webp'
              });
            }, 'image/webp', quality);
          };

          img.src = URL.createObjectURL(file);
        });
      };

      const handleConvert = async () => {
        for (const file of files) {
          const { blob, filename } = await convertImage(file);

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
        }
      };

      return React.createElement(
        "div",
        { className: "card" },
        React.createElement("h1", null, "WebP Image Converter"),

        React.createElement(
          "select",
          {
            value: category,
            onChange: (e) => setCategory(e.target.value)
          },
          React.createElement("option", { value: "logo" }, "Logo (Small)"),
          React.createElement("option", { value: "hero" }, "Hero (Fullscreen)")
        ),

        React.createElement("input", {
          type: "file",
          multiple: true,
          accept: "image/png,image/jpeg,image/webp",
          onChange: (e) => setFiles([...e.target.files])
        }),

        React.createElement(
          "button",
          {
            disabled: !files.length,
            onClick: handleConvert
          },
          "Convert & Download"
        ),

        React.createElement(
          "small",
          null,
          "Output otomatis WebP dengan nama file yang sama"
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>

</body>

</html>
